<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Play Deadshot.io</title>
<style>
body, html {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
}
iframe {
  border: none;
  width: 100vw;
  height: 100vh;
  display: block;
}

/* Very small FPS counter (bottom-right) */
#fps-counter {
  position: fixed;
  right: 8px;
  bottom: 8px;
  background: rgba(0,0,0,0.56);
  color: #7CFC00;
  font-family: monospace;
  font-size: 11px;
  padding: 3px 6px;
  border-radius: 6px;
  z-index: 2147483647; /* ensure it's above other content */
  pointer-events: none; /* don't block taps/clicks */
  user-select: none;
  box-shadow: 0 1px 4px rgba(0,0,0,0.6);
  opacity: 0.92;
  transition: opacity .2s;
  line-height: 1;
}
#fps-counter.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<iframe src="https://deadshot.io" title="Deadshot.io Game"></iframe>

<!-- Added: very small FPS counter. No other behavior or fullscreen code changed. -->
<div id="fps-counter" aria-hidden="true">-- FPS</div>
<script>
(function(){
  const el = document.getElementById('fps-counter');
  if (!el) return;

  let lastUpdate = performance.now();
  let frames = 0;

  function tick(now) {
    frames++;
    if (now - lastUpdate >= 500) { // update twice a second for stability and low overhead
      const elapsed = now - lastUpdate;
      const fps = Math.round((frames * 1000) / elapsed);
      el.textContent = fps + ' FPS';
      if (fps >= 50) el.style.color = '#7CFC00';
      else if (fps >= 30) el.style.color = '#FFD700';
      else el.style.color = '#FF4500';
      frames = 0;
      lastUpdate = now;
    }
    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);

  // Optional: toggle visibility with Shift+F (does not interfere with clicks/taps)
  window.addEventListener('keydown', (e) => {
    if (e.shiftKey && (e.key === 'F' || e.key === 'f')) el.classList.toggle('hidden');
  });
})();
</script>
</body>
</html>
