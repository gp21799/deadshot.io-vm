<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Play Deadshot.io</title>
<style>
body, html {
margin: 0;
padding: 0;
height: 100%;
width: 100%;
overflow: hidden;
}
iframe {
border: none;
width: 100vw;
height: 100vh;
display: block;
}

/* FPS meter styles (small, centered at the top, non-interactive) */
#fps-meter {
  position: fixed;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 999999;
  background: rgba(0,0,0,0.6);
  color: #fff;
  padding: 4px 10px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Segoe UI Mono", monospace;
  font-size: 13px;
  border-radius: 6px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.5);
  pointer-events: none; /* allow clicks to pass through to the iframe */
  user-select: none;
  min-width: 72px;
  text-align: center;
  opacity: 0.95;
}
</style>
</head>
<body>
<iframe src="https://deadshot.io" title="Deadshot.io Game"></iframe>

<!-- FPS meter overlay (non-intrusive, centered top) -->
<div id="fps-meter">-- FPS</div>

<script>
(function() {
  const el = document.getElementById('fps-meter');

  let lastTime = performance.now();
  let frameCount = 0;
  let lastUpdate = performance.now();

  function update(now) {
    frameCount++;
    const sinceLast = now - lastUpdate;

    // update displayed FPS every 500ms for stability
    if (sinceLast >= 500) {
      const fps = Math.round((frameCount * 1000) / sinceLast);
      frameCount = 0;
      lastUpdate = now;
      el.textContent = fps + ' FPS';

      // color coding for quick visual feedback
      if (fps >= 50) {
        el.style.background = 'rgba(0,160,80,0.9)'; // green
      } else if (fps >= 30) {
        el.style.background = 'rgba(220,140,10,0.9)'; // amber
      } else {
        el.style.background = 'rgba(180,30,30,0.9)'; // red
      }
    }

    requestAnimationFrame(update);
  }

  requestAnimationFrame(update);
})();
</script>
</body>
</html>
